version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./database:/app/database

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  nocodb:
    image: nocodb/nocodb:latest
    ports:
      - "8080:8080"
    environment:
      - NC_DB=sqlite:///usr/app/data/nocodb.db
    volumes:
      - nocodb_data:/usr/app/data

volumes:
  nocodb_data:
